services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in Coolify}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in Coolify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    volumes:
      - nuvia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    expose:
      - "5432"

  migrate:
    # Coolify extension: this one-shot job must not make the app look unhealthy.
    exclude_from_hc: true
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host database and port 5432}
    command: ["npx", "prisma", "migrate", "deploy", "--schema", "packages/database/prisma/schema.prisma"]
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host database and port 5432}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN to the public https URL}
      RSVP_TOKEN_ENCRYPTION_KEY: ${RSVP_TOKEN_ENCRYPTION_KEY:?Set a base64 32-byte key}
      PROJECT_DOCUMENT_ENCRYPTION_KEY: ${PROJECT_DOCUMENT_ENCRYPTION_KEY:?Set a dedicated base64 32-byte key for private event documents}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID:-}
      GA4_SERVICE_ACCOUNT_EMAIL: ${GA4_SERVICE_ACCOUNT_EMAIL:-}
      GA4_SERVICE_ACCOUNT_PRIVATE_KEY: ${GA4_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      PORTFOLIO_STORAGE_DIR: /app/data/vendor-portfolio
      PRIVATE_UPLOAD_STORAGE_DIR: /app/data/private-contribution-proofs
      PROJECT_DOCUMENT_STORAGE_DIR: /app/data/private-project-documents
    volumes:
      - nuvia_vendor_portfolio:/app/data/vendor-portfolio
      - nuvia_contribution_proofs:/app/data/private-contribution-proofs
      - nuvia_project_documents:/app/data/private-project-documents
    expose:
      - "4000"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        API_INTERNAL_URL: http://api:4000/api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000/api/v1
      NEXT_PUBLIC_API_URL: /api/v1
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  nuvia_postgres_data:
  nuvia_vendor_portfolio:
  nuvia_contribution_proofs:
  nuvia_project_documents:
